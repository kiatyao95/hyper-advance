<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Redirecting…</title>
  <script>
    (function () {
      var l = window.location;
      var path = l.pathname;

      if (path.startsWith('/hyper-advance/docs/')) {
        path = path.slice('/hyper-advance/docs'.length) || '/';
      } else if (path === '/hyper-advance' || path === '/hyper-advance/docs' || path === '/hyper-advance/docs/') {
        path = '/';
      }

      if (path !== '/' && !path.endsWith('/') && !/\.\w+$/.test(path)) {
        l.replace(l.origin + path + '/' + l.search + l.hash);
        return;
      }

      if (path !== l.pathname) {
        l.replace(l.origin + path + l.search + l.hash);
      }
    })();
  </script>
</head>
<body>
  <p>Redirecting…</p>
</body>
</html>
